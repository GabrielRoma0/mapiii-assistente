<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#FFFFFF}</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:40px;padding:40px;background:#FFFFFF;align-items:flex-start">
  <div id="banner" style="width:1600px;height:400px;background:#F2E9E4;display:flex;align-items:center;justify-content:center;font-family:Nunito,sans-serif">
    <dc-import name="MapiLogo" size="{{ 180 }}" pin="#4A4E69" cut="#F2E9E4" text="#22223B" hint-size="620px,240px"></dc-import>
  </div>
  <div id="logo-branco" style="width:1200px;height:600px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:Nunito,sans-serif">
    <dc-import name="MapiLogo" size="{{ 200 }}" pin="#4A4E69" cut="#FFFFFF" text="#22223B" hint-size="680px,260px"></dc-import>
  </div>
</div>
</x-dc>
</body>
</html>
