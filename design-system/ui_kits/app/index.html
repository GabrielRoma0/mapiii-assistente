<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mapiii · App</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script>window.MAPI = Object.values(window).find(o => o && typeof o === 'object' && o.Logo && o.Button) || {};</script></head>
<body style="margin:0;padding:24px;background:#EDE3DD">
<div id="root"></div>
<script type="text/babel" src="Phone.jsx"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="MapScreen.jsx"></script>
<script type="text/babel" src="CaptureScreen.jsx"></script>
<script type="text/babel" src="DetailScreen.jsx"></script>
<script type="text/babel">
const SCREENS = [['login', 'Entrar', LoginScreen], ['mapa', 'Mapa', MapScreen], ['captura', 'Nova foto', CaptureScreen], ['detalhe', 'Detalhe', DetailScreen]];
function App() {
  const [cur, setCur] = React.useState(localStorage.getItem('mapi-kit-screen') || 'login');
  const go = id => { setCur(id); localStorage.setItem('mapi-kit-screen', id); };
  const S = (SCREENS.find(s => s[0] === cur) || SCREENS[0])[2];
  return (
    <div style={{ display: 'flex', gap: 40, alignItems: 'flex-start', fontFamily: 'var(--font-sans)' }}>
      <S go={go} />
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, paddingTop: 20 }}>
        <span style={{ fontSize: 14, fontWeight: 800, color: 'var(--text-muted)' }}>Telas</span>
        {SCREENS.map(([id, l]) => <window.MAPI.Button key={id} size="md" variant={id === cur ? 'primary' : 'secondary'} onClick={() => go(id)}>{l}</window.MAPI.Button>)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
