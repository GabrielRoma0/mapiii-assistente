<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 40 40" width="{{ size }}" height="{{ size }}" role="img" aria-label="{{ label }}" style="display:block;flex:none;overflow:visible">
<path d="M20 5L36 33H4Z" fill="#22223B" stroke="#22223B" style="stroke-width:6;stroke-linejoin:round"></path>
<path d="M20 5L36 33H4Z" fill="#D9874E" stroke="#D9874E" style="stroke-width:2;stroke-linejoin:round"></path>
<svg x="10.5" y="13.5" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#22223B" style="stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><path d="{{ p0 }}"></path><path d="{{ p1 }}"></path><path d="{{ p2 }}"></path><path d="{{ p3 }}"></path><path d="{{ p4 }}"></path></svg>
<g display="{{ dMini }}"><circle cx="35" cy="33" r="7.5" fill="#FFFFFF" stroke="#22223B" style="stroke-width:2"></circle><svg x="29.5" y="27.5" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#22223B" style="stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round"><path d="{{ m0 }}"></path><path d="{{ m1 }}"></path><path d="{{ m2 }}"></path></svg></g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;subtipo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;carro&quot;,&quot;abandonado&quot;,&quot;cacamba&quot;,&quot;obra&quot;,&quot;outro&quot;],&quot;default&quot;:&quot;cacamba&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;tsType&quot;:&quot;number&quot;}}">
const I = {
  carro: ["M5.5 17H3v-4l2.5-1.2L8 7.5h7.5l3.5 4.3 2 .7V17h-2.5","M9.5 17h5","M7.5 15a2 2 0 1 0 0 4a2 2 0 1 0 0-4","M16.5 15a2 2 0 1 0 0 4a2 2 0 1 0 0-4"],
  cacamba: ["M3 9.5h18l-2.2 9H5.2z","M7 9.5l2.3-3.5 2.2 2 2.5-3 3 4.5","M8 13v2.5","M12 13v2.5","M16 13v2.5"],
  obra: ["M10 4h4l5.5 15h-15z","M8 10h8","M6.3 14.6h11.4","M3 19.5h18"],
  obstaculo: ["M9 20V8a3 3 0 0 1 6 0v12","M6 20h12","M9 12.5h6"]
};
const MINI = {
  relogio: ["M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18","M12 7.5V12l3 2"],
  duvida: ["M9.5 9.3a2.6 2.6 0 1 1 3.7 2.4c-.7.4-1.2.9-1.2 1.7","M12 16.8v.1"]
};
const T = {
  carro: { icon: 'carro', mini: 'relogio', label: 'Obstáculo: carro parado há muito tempo' },
  abandonado: { icon: 'carro', mini: 'duvida', label: 'Obstáculo: veículo possivelmente quebrado ou abandonado' },
  cacamba: { icon: 'cacamba', label: 'Obstáculo: caçamba de entulho' },
  obra: { icon: 'obra', label: 'Obstáculo: material de obra' },
  outro: { icon: 'obstaculo', label: 'Obstáculo: outro' }
};
class Component extends DCLogic {
  renderVals() {
    const t = T[this.props.subtipo] || T.outro;
    const p = I[t.icon], m = MINI[t.mini] || [];
    const z = '';
    return { size: this.props.size ?? 40, label: t.label, p0: p[0] || z, p1: p[1] || z, p2: p[2] || z, p3: p[3] || z, p4: p[4] || z, dMini: t.mini ? 'inline' : 'none', m0: m[0] || z, m1: m[1] || z, m2: m[2] || z };
  }
}
</script>
</body>
</html>
