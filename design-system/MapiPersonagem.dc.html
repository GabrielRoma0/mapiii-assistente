<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:240},&quot;estado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bom&quot;,&quot;atencao&quot;,&quot;evite&quot;,&quot;chuva&quot;,&quot;comemorando&quot;,&quot;agradecendo&quot;,&quot;ouvindo&quot;,&quot;procurando&quot;,&quot;achei&quot;,&quot;verificado&quot;,&quot;duvida&quot;,&quot;recusa&quot;,&quot;esperando&quot;],&quot;default&quot;:&quot;bom&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:120,&quot;tsType&quot;:&quot;number&quot;}}">

  agradecendo: { body: '#F4E0E5', label: 'Mapi agradecendo: aviso enviado', eyes: 'closed', mouth: 'M62 84Q70 92 78 84', arms: 'M38 86Q44 100 59 103M102 86Q96 100 81 103', h: [59, 103, 81, 103], heart: true },

  recusa: { body: '#F6E4D6', label: 'Mapi recusando com gentileza', eyes: 'open', brows: 'M52 62Q58 60 64 63M76 63Q82 60 88 62', mouth: 'M64 85Q70 89 76 85', arms: 'M38 86Q46 98 58 100M102 82Q116 80 118 68', h: [58, 100, 118, 64] },
  esperando: { body: '#E6DCE0', label: 'Mapi esperando', eyes: 'open', mouth: 'M64 85Q70 90 76 85', arms: 'M38 86Q44 100 59 103M102 86Q96 100 81 103', h: [59, 103, 81, 103] }
};
class Component extends DCLogic {
  renderVals() {
    const s = S[this.props.estado] || S.bom;
    const size = this.props.size ?? 120;
    const on = b => b ? 'inline' : 'none';
    const lk = s.look || 0, ey = s.up ? 69 : 72;
    return {
      w: size, h: Math.round(size * 170 / 140), body: s.body, label: s.label,
      dOpen: on(s.eyes === 'open'), dClosed: on(s.eyes === 'closed'),
      lx: 58 + lk, rx: 82 + lk, ey, lhx: 59.8 + lk, rhx: 83.8 + lk, hy: ey - 1.8,
      dBrows: on(!!s.brows), brows: s.brows || 'M0 0',
      dMouthLine: on(!!s.mouth && !s.big), mouth: s.mouth || 'M0 0', dMouthBig: on(!!s.big),
      dHeart: on(!!s.heart), dUmbrella: on(!!s.umbrella), dAlert: on(!!s.alert), dChuva: on(!!s.umbrella), dFesta: on(!!s.festa),
      dWaves: on(!!s.waves), dLupa: on(!!s.lupa), dSpark: on(!!s.spark), dShield: on(!!s.shield), dQuestion: on(!!s.question),
      dArmsBack: 'none', armsBack: 'M0 0', arms: s.arms,
      h1x: s.h[0], h1y: s.h[1], h2x: s.h[2], h2y: s.h[3]

}
</script>
