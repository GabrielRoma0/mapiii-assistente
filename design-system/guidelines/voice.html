<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:24px;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-body)">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:16px;line-height:1.5"><div style="padding:12px 14px;border-radius:16px;background:var(--status-success-bg);color:var(--status-success-fg)"><b>✓ Sim:</b> “Obrigado. Sua foto já está no mapa.”</div><div style="padding:12px 14px;border-radius:16px;background:var(--status-error-bg);color:var(--status-error-fg)"><b>✕ Não:</b> “Solicitação protocolada com sucesso.”</div><div style="padding:12px 14px;border-radius:16px;background:var(--status-success-bg);color:var(--status-success-fg)"><b>✓ Sim:</b> “A IA tem dúvida. Pode conferir?”</div><div style="padding:12px 14px;border-radius:16px;background:var(--status-error-bg);color:var(--status-error-fg)"><b>✕ Não:</b> “Classificação com baixo índice de confiança.”</div><div style="padding:12px 14px;border-radius:16px;background:var(--status-success-bg);color:var(--status-success-fg)"><b>✓ Sim:</b> “Fotografe a calçada inteira, com a rua aparecendo.”</div><div style="padding:12px 14px;border-radius:16px;background:var(--status-error-bg);color:var(--status-error-fg)"><b>✕ Não:</b> “Insira imagem válida.”</div></div>
</body></html>
