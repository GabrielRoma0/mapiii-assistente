<!-- @dsCard group="Brand" viewport="700x200" subtitle="Área de proteção = altura da pinha" name="Logo: o que não fazer" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../_ds_bundle.js"></script></head><body style="margin:0;padding:24px;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-body)"><div id="root"></div>
<script type="text/babel">
const NS = Object.values(window).find(o => o && typeof o === 'object' && o.Logo && o.Button) || {};
const { Logo, Mark } = NS;
ReactDOM.createRoot(document.getElementById('root')).render(<div style={{display:'grid',gridTemplateColumns:'1.3fr 1fr 1fr 1fr',gap:12}}>
<div style={{height:150,borderRadius:20,background:'#fff',display:'grid',placeItems:'center'}}><div style={{padding:16,border:'2px dashed var(--mapi-grape-700)'}}><Logo size={32} /></div></div>
{[['scaleX(1.5)','Não distorça'],['rotate(-25deg)','Não gire'],['none','Não troque a cor']].map(([t,l],i) => <div key={l} style={{display:'flex',flexDirection:'column',gap:6}}><div style={{height:120,borderRadius:20,background:'#fff',display:'grid',placeItems:'center',overflow:'hidden'}}><div style={{transform:t}}><Mark size={52} color={i===2?'#D9874E':undefined} /></div></div><b style={{fontSize:14,color:'var(--mapi-coral-700)'}}>✕ {l}</b></div>)}</div>);
</script></body></html>
