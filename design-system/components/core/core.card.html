<!-- @dsCard group="Components" viewport="700x420" name="Botões, campos e filtros" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script></head><body style="margin:0;padding:24px;background:var(--bg-app)"><div id="root"></div>
<script type="text/babel">
const NS = Object.values(window).find(o => o && typeof o === 'object' && o.Logo && o.Button) || {};
const { Button, IconButton, Input, Checkbox, FilterChip } = NS;
function Demo() { const [c, setC] = React.useState(true); return (<div style={{display:'flex',flexDirection:'column',gap:16}}>
  <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}}><Button icon="enviar">Enviar foto</Button><Button variant="secondary">Corrigir</Button><Button variant="text" size="md">Alterar local</Button><Button variant="danger">Excluir</Button><Button disabled>Enviar</Button></div>
  <div style={{display:'flex',gap:12,alignItems:'center'}}><IconButton icon="voltar" label="Voltar" variant="outline" /><IconButton icon="filtro" label="Filtros" variant="tint" /><Button icon="camera" size="xl" pill>Registrar</Button></div>
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,alignItems:'start'}}><Input label="Como podemos te chamar?" placeholder="Seu nome" /><div style={{display:'flex',flexDirection:'column',gap:8}}><Checkbox label="Uso cadeira de rodas" checked={c} onChange={setC} /><Checkbox label="Ando com carrinho de bebê" /></div></div>
  <div style={{display:'flex',gap:8}}><FilterChip label="Todas" selected /><FilterChip label="Sem rampa" category="sem_rampa_ou_degrau" /><FilterChip label="Quebrada" category="calcada_quebrada" /></div>
</div>); }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
