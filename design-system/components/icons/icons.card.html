<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script></head><body style="margin:0;padding:24px;background:var(--bg-app)"><div id="root"></div>
<script type="text/babel">
const NS = Object.values(window).find(o => o && typeof o === 'object' && o.Logo && o.Button) || {};
const { Icon } = NS;
function Demo() {  return (<div style={{display:'grid',gridTemplateColumns:'repeat(9,1fr)',gap:10}}>{['degrau','obstaculo','quebrada','estreita','ok','camera','local','filtro','enviar','revisar','g0','g1','g2','g3','ia','mapa','busca','download','voltar','fechar','mais','check','usuario','lista','grafico','galeria'].map(n => <div key={n} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,padding:'10px 0',borderRadius:14,background:'#fff'}}><Icon name={n} size={24} /><span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-muted)'}}>{n}</span></div>)}</div>); }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
