<!-- @dsCard group="Components" viewport="700x560" name="Categorias, gravidade e ocorrência" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script></head><body style="margin:0;padding:24px;background:var(--bg-app)"><div id="root"></div>
<script type="text/babel">
const NS = Object.values(window).find(o => o && typeof o === 'object' && o.Logo && o.Button) || {};
const { CategoryMarker, CategoryTag, SeverityPicker, OccurrenceCard, CATEGORIES } = NS;
function Demo() { const [g, setG] = React.useState(2); return (<div style={{display:'flex',flexDirection:'column',gap:18}}>
  <div style={{display:'flex',gap:20,alignItems:'center'}}>{Object.keys(CATEGORIES).map(k => <CategoryMarker key={k} category={k} size={44} title={CATEGORIES[k].label} />)}</div>
  <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{Object.keys(CATEGORIES).map(k => <CategoryTag key={k} category={k} size="sm" />)}</div>
  <SeverityPicker value={g} onChange={setG} />
  <OccurrenceCard category="obstaculo_no_caminho" address="Rua Augusta, 1.200" meta="Consolação · há 2 dias · 120 m" severity={3} needsReview />
</div>); }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
